<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Universo De Las Compras - ¡Calidad y Cumplimiento!</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
.slide-in { animation: slideIn 0.3s ease-out forwards; }
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.fade-in { animation: fadeIn 0.2s ease-out forwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.scrollbar-none::-webkit-scrollbar { display: none; }
.scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-indigo-200">

<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full px-4 md:px-0"></div>

<header class="bg-gradient-to-r from-slate-950 via-indigo-950 to-indigo-900 text-white shadow-md relative overflow-hidden shrink-0">
<div class="absolute top-0 right-0 w-80 h-80 bg-indigo-500 rounded-full filter blur-[100px] opacity-20 -mr-10 -mt-10"></div>
<div class="absolute bottom-0 left-0 w-64 h-64 bg-violet-500 rounded-full filter blur-[80px] opacity-20 -ml-10 -mb-10"></div>

<div class="max-w-7xl mx-auto px-4 py-8 md:py-12 flex flex-col items-center text-center relative z-10">
<div id="shop-logo-container" class="mb-5"></div>
<div class="flex items-center gap-2 mb-2">
<h1 class="text-3xl md:text-5xl font-black tracking-tight uppercase bg-clip-text text-transparent bg-gradient-to-r from-white via-indigo-100 to-yellow-100">
El Universo De Las Compras
</h1>
</div>
<p class="text-xs md:text-sm font-extrabold tracking-widest text-emerald-300 uppercase flex items-center gap-1.5 px-4 py-1.5 bg-white/5 border border-white/10 rounded-full mb-4">
<i class="fa-solid fa-circle-check text-emerald-300"></i> ¡Calidad y Cumplimiento!
</p>
<div id="shop-description-container" class="mb-6 max-w-2xl px-4 text-center"></div>
<div id="social-header-links" class="flex items-center gap-4"></div>
</div>
</header>

<nav class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
<div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
<button onclick="changeView('catalog')" class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs md:text-sm font-black uppercase tracking-wider transition-all bg-indigo-50 text-indigo-700 shadow-xs">
<i class="fa-solid fa-bag-shopping"></i> <span>Catálogo Público</span>
</button>
<button onclick="toggleCart(true)" class="relative p-2.5 text-slate-700 hover:text-indigo-700 bg-slate-100 hover:bg-indigo-50 rounded-full transition-all">
<i class="fa-solid fa-bag-shopping text-lg"></i>
<span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full animate-bounce">0</span>
</button>
</div>
</nav>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 md:py-8">
<section id="view-catalog" class="fade-in">
<div class="bg-white rounded-2xl p-4 md:p-6 shadow-xs border border-slate-200 mb-8 flex flex-col gap-4 md:flex-row md:items-center justify-between">
<div class="relative flex-1 max-w-lg">
<i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
<input type="text" id="catalog-search" oninput="handleSearch()" placeholder="¿Qué producto buscas hoy?" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-semibold" />
</div>
<div class="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0 scrollbar-none" id="categories-filter-container"></div>
</div>

<div class="flex items-center justify-between mb-6">
<h2 class="text-lg md:text-xl font-black text-slate-800 flex items-center gap-2"><i class="fa-solid fa-layer-group text-indigo-600"></i> Catálogo</h2>
<span id="product-count" class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-100">0 Artículos</span>
</div>
<div id="catalog-products-grid" class="grid grid-cols-1 xs:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
</section>

<section id="view-detail" class="hidden fade-in"></section>
</main>

<div id="checkout-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
<div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-200 animate-slide-in">
<div class="bg-emerald-600 text-white p-5 flex items-center justify-between">
<div class="flex items-center gap-2"><i class="fa-solid fa-paper-plane text-yellow-300"></i><h3 class="text-xs font-black uppercase tracking-wider">Formulario de Despacho</h3></div>
<button onclick="toggleCheckoutModal(false)" class="p-1 hover:bg-white/10 rounded-full text-white"><i class="fa-solid fa-xmark"></i></button>
</div>
<form onsubmit="sendOrderToWhatsApp(event)" class="p-5 space-y-4">
<div>
<label class="block text-[10px] font-black text-slate-500 uppercase mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-user text-indigo-500"></i> Nombre Completo *</label>
<input type="text" id="chk-name" required placeholder="Ej. Juan Pérez" class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500" />
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-[10px] font-black text-slate-500 uppercase mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-map-pin text-indigo-500"></i> Ciudad *</label>
<input type="text" id="chk-city" required placeholder="Ej. Cali" class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500" />
</div>
<div>
<label class="block text-[10px] font-black text-slate-500 uppercase mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-map-pin text-indigo-500"></i> Departamento *</label>
<input type="text" id="chk-department" required placeholder="Ej. Valle" class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500" />
</div>
</div>
<div>
<label class="block text-[10px] font-black text-slate-500 uppercase mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-map-pin text-indigo-500"></i> Dirección Exacta *</label>
<input type="text" id="chk-address" required placeholder="Ej. Calle 10 #2-3" class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-emerald-500" />
</div>
<button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2 shadow-md">
<i class="fa-solid fa-paper-plane"></i> <span>Confirmar y Pedir por WhatsApp</span>
</button>
</form>
</div>
</div>

<div id="cart-drawer" class="hidden fixed inset-0 z-50 overflow-hidden bg-slate-900/60 backdrop-blur-xs flex justify-end">
<div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl slide-in relative">
<div class="bg-slate-950 text-white p-5 flex items-center justify-between">
<div class="flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-emerald-400"></i><h3 class="text-sm font-black uppercase tracking-wide">Bolsa de Compras</h3></div>
<button onclick="toggleCart(false)" class="p-1.5 hover:bg-white/10 rounded-full text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
</div>
<div id="cart-drawer-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
<div id="cart-drawer-summary" class="hidden border-t border-slate-200 p-5 bg-slate-50 space-y-4 shrink-0">
<div class="space-y-2">
<div class="flex justify-between text-xs text-slate-500 font-bold"><span>Artículos Totales:</span><span id="cart-summary-qty">0</span></div>
<div class="flex justify-between text-xs text-slate-500 font-bold"><span>Despacho:</span><span class="text-emerald-600 font-black uppercase">Gratis</span></div>
<div class="border-t border-slate-200 pt-2 flex justify-between items-baseline"><span class="text-xs font-black text-slate-800 uppercase">Total:</span><span id="cart-summary-total" class="text-indigo-600 text-lg font-black">$`0 COP</span></div>
</div>
<button onclick="startCheckout('cart')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl text-xs font-black uppercase tracking-widest shadow-md flex items-center justify-center gap-2"><i class="fa-solid fa-paper-plane"></i><span>Realizar Pedido Completo</span></button>
</div>
</div>
</div>

<footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 shrink-0">
<div class="max-w-7xl mx-auto px-4 text-center space-y-4">
<div class="flex justify-center items-center gap-2"><div id="footer-logo-container"></div><p class="text-xs font-black text-white tracking-widest uppercase">EL UNIVERSO DE LAS COMPRAS</p></div>
<p class="text-sm font-semibold text-slate-300 bg-white/5 py-2 px-4 rounded-xl border border-white/5 max-w-max mx-auto shadow-xs">Creado por Sebastian Jiménez Guzmán</p>
<div id="social-footer-links" class="flex justify-center gap-3"></div>
</div>
</footer>

<script>
// Inicialización estable con tus llaves reales, Sebastián
const firebaseConfig = {
apiKey: "AIzaSyAu4U2U7KVcYhlXBopZkYUtXsRiKnnS5bg",
authDomain: "tienda-78ca2.firebaseapp.com",
projectId: "tienda-78ca2",
storageBucket: "tienda-78ca2.firebasestorage.app",
messagingSenderId: "685423266977",
appId: "1:685423266977:web:2dedef021af1a3cfd0b4e0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Estados globales
var products = [];
var shopConfig = {};
var cart = [];
var selectedCategoryFilter = 'Todos';
var selectedProduct = null;
var currentDetailImageIdx = 0;
var selectedSize = '';
var selectedColor = '';
var checkoutType = 'single';

// Escuchar base de datos en la nube
db.collection("config").doc("tienda").onSnapshot((docSnap) => {
if (docSnap.exists) {
shopConfig = docSnap.data();
} else {
shopConfig = { storeDescription: '¡Bienvenidos!', whatsappLink: 'https://wa.me/573100000000' };
}
renderHeaderAndFooter();
});

db.collection("products").onSnapshot((querySnapshot) => {
products = [];
querySnapshot.forEach((doc) => {
products.push({ id: doc.id, ...doc.data() });
});
renderCatalog();
if (selectedProduct) {
selectedProduct = products.find(p => p.id === selectedProduct.id) || null;
if(selectedProduct) renderProductDetailView();
else changeView('catalog');
}
});

function showNotification(message, type = 'success') {
const container = document.getElementById('toast-container');
const toast = document.createElement('div');
let bgClass = type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200';
toast.className = flex items-center gap-3 px-5 py-4 rounded-xl shadow-xl border${bgClass} fade-in; toast.innerHTML =<i class="fa-solid {message}</span>`;
container.appendChild(toast);
setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(()=>toast.remove(),300); }, 3000);
}

function changeView(view) {
document.getElementById('view-catalog').classList.add('hidden');
document.getElementById('view-detail').classList.add('hidden');
document.getElementById(view-${view}`).classList.remove('hidden');
if (view === 'catalog') renderCatalog();
window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setCategoryFilter(cat) {
selectedCategoryFilter = cat;
renderCatalog();
}

function handleSearch() { renderCatalog(); }

function convertToDirectLink(url) {
if (!url) return '';
url = url.trim();
const ibbRegex = /https?://ibb.co/([a-zA-Z0-9]+)/i;
const match = url.match(ibbRegex);
return match && match[1] ? https://i.ibb.co/${match[1]}/image.png` : url;
}

function renderHeaderAndFooter() {
const convertedLogoUrl = convertToDirectLink(shopConfig.logoUrl);
document.getElementById('shop-logo-container').innerHTML = convertedLogoUrl
? <img src="${convertedLogoUrl}" class="h-24 md:h-36 w-auto object-contain mx-auto rounded-2xl shadow-lg bg-white/10 p-2.5 border border-white/20">:<div class="w-20 h-20 bg-gradient-to-tr from-indigo-500 to-violet-500 rounded-3xl flex items-center justify-center border mx-auto"><i class="fa-solid fa-wand-magic-sparkles text-3xl text-yellow-300"></i></div>`;

document.getElementById('footer-logo-container').innerHTML = convertedLogoUrl ? <img src="${convertedLogoUrl}" class="h-8 w-auto opacity-80" />:<i class="fa-solid fa-wand-magic-sparkles text-yellow-300"></i>; document.getElementById('shop-description-container').innerHTML =<p class="text-sm md:text-base text-slate-200 max-w-xl mx-auto leading-relaxed font-semibold">${shopConfig.storeDescription || ''}&lt;/p>;

const socials = ${shopConfig.facebookUrl ? <a href="${shopConfig.facebookUrl}" target="_blank" class="p-3 bg-blue-600 text-white rounded-full shadow-md w-11 h-11 flex items-center justify-center hover:scale-110 transition-all"><i class="fa-brands fa-facebook"></i></a>: ''}${shopConfig.instagramUrl ? <a href="${shopConfig.instagramUrl}" target="_blank" class="p-3 bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 text-white rounded-full shadow-md w-11 h-11 flex items-center justify-center hover:scale-110 transition-all"><i class="fa-brands fa-instagram"></i></a>: ''}${shopConfig.tiktokUrl ? <a href="${shopConfig.tiktokUrl}" target="_blank" class="p-3 bg-black text-white rounded-full shadow-md border w-11 h-11 flex items-center justify-center hover:scale-110 transition-all"><i class="fa-brands fa-tiktok"></i></a>: ''};
document.getElementById('social-header-links').innerHTML = socials;
document.getElementById('social-footer-links').innerHTML = socials;
}

function renderCatalog() {
const query = document.getElementById('catalog-search').value.toLowerCase();
const filtered = products.filter(p => {
return (p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query)) && (selectedCategoryFilter === 'Todos' || p.category === selectedCategoryFilter);
});

document.getElementById('product-count').innerText = ``${filtered.length} Artículos`;

const categories = ['Todos', ...new Set(products.map(p => p.category))];
let catHtml = '';
categories.forEach(cat => {
catHtml += <button onclick="setCategoryFilter('${cat}')" class="px-4 py-2 rounded-full text-xs font-bold shrink-0 transition-all ${selectedCategoryFilter === cat ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}"&gt;${cat}</button>`;
});
document.getElementById('categories-filter-container').innerHTML = catHtml;

const grid = document.getElementById('catalog-products-grid');
if(filtered.length === 0) {
grid.innerHTML = <div class="col-span-full py-12 text-center"&gt;&lt;i class="fa-solid fa-circle-exclamation text-4xl text-slate-400 mb-4"&gt;&lt;/i&gt;&lt;h3 class="text-base font-black text-slate-800"&gt;No hay productos cargados&lt;/h3&gt;&lt;/div>;
return;
}

let html = '';
filtered.forEach(p => {
const hasDiscount = p.originalPrice > p.currentPrice;
html += &lt;div class="bg-white rounded-2xl overflow-hidden border hover:shadow-xl transition-all duration-300 flex flex-col relative group"&gt; &lt;div class="absolute top-3 left-3 z-10 flex flex-col gap-1"&gt; &lt;span class="bg-white/95 text-slate-800 text-[10px] font-black px-2.5 py-1 rounded-md border uppercase shadow-xs"&gt;${p.category}</span>
{convertToDirectLink(p.images[0])}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>
<div class="p-4 flex flex-col flex-1">
<h3 class="text-sm font-black text-slate-800 mb-1 line-clamp-1">{p.description}</p>
<div class="mb-4 bg-slate-50 p-2.5 rounded-xl border">
latex
{hasDiscount ? `<div class="text-slate-400 text-[10px] line-through font-bold"&gt;Antes: 

{p.originalPrice.toLocaleString('es-CO')}</div>: ''} &lt;div class="text-indigo-600 text-base font-black"&gt;${p.currentPrice.toLocaleString('es-CO')} <span class="text-[9px] text-slate-400">COP</span></div>
</div>
<button onclick="viewProductDetail('${p.id}')" class="w-full bg-slate-900 group-hover:bg-indigo-600 text-white py-3 px-4 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all"&gt;&lt;i class="fa-solid fa-eye mr-1"&gt;&lt;/i&gt; Ver Detalles&lt;/button&gt; &lt;/div&gt; &lt;/div&gt;;
});
grid.innerHTML = html;
}

function viewProductDetail(id) {
selectedProduct = products.find(p => p.id === id);
currentDetailImageIdx = 0;
selectedSize = selectedProduct.sizes[0] || 'Estándar';
selectedColor = selectedProduct.colors[0] || 'Original';
renderProductDetailView();
changeView('detail');
}

function renderProductDetailView() {
let thumbs = '';
selectedProduct.images.forEach((img, idx) => {
thumbs += <button onclick="changeDetailImage(${idx})" class="aspect-square w-full rounded-xl overflow-hidden border-2 bg-slate-100 ${idx === currentDetailImageIdx ? 'border-indigo-600 scale-95' : 'border-transparent'}"&gt;&lt;img src="${convertToDirectLink(img)}" class="w-full h-full object-cover"></button>`;
});

let sizes = '';
if(selectedProduct.sizes.length > 0) {
sizes += <div&gt;&lt;h4 class="text-xs font-black text-slate-500 mb-2"&gt;Talla Elegida:&lt;/h4&gt;&lt;div class="flex flex-wrap gap-1.5">;
selectedProduct.sizes.forEach(s => {
sizes += <button onclick="selectDetailSize('${s}')" class="px-3 py-2 rounded-xl text-xs font-bold border {s}</button>; }); sizes +=</div></div>`;
}

let colors = '';
if(selectedProduct.colors.length > 0) {
colors += <div&gt;&lt;h4 class="text-xs font-black text-slate-500 mb-2"&gt;Color Elegido:&lt;/h4&gt;&lt;div class="flex flex-wrap gap-1.5">;
selectedProduct.colors.forEach(c => {
colors += <button onclick="selectDetailColor('${c}')" class="px-3 py-2 rounded-xl text-xs font-bold border ${c === selectedColor ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700'}"&gt;${c}</button>; }); colors +=</div></div>`;
}

let features = '';
selectedProduct.features.forEach(f => {
features += <div class="flex items-start gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-100"&gt;&lt;span class="w-5 h-5 rounded-full bg-emerald-100 flex items-center justify-center shrink-0 mt-0.5"&gt;&lt;i class="fa-solid fa-check text-[10px] text-emerald-700"&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class="text-xs text-slate-600"&gt;${f}</span></div>`;
});

const cleanActiveImg = convertToDirectLink(selectedProduct.images[currentDetailImageIdx]);

document.getElementById('view-detail').innerHTML = &lt;div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm"&gt; &lt;div class="bg-slate-50 px-4 py-4 md:px-6 border-b flex items-center justify-between"&gt; &lt;button onclick="changeView('catalog')" class="flex items-center gap-1.5 text-slate-600 hover:text-indigo-600 text-xs font-black uppercase tracking-wider"&gt;&lt;i class="fa-solid fa-arrow-left"&gt;&lt;/i&gt; Volver&lt;/button&gt; &lt;span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-md uppercase border"&gt;${selectedProduct.category}</span>
</div>
<div class="p-4 md:p-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
<div class="flex flex-col gap-4">
<div class="aspect-square w-full rounded-2xl bg-slate-100 relative overflow-hidden border">
<img src="${cleanActiveImg}" class="w-full h-full object-cover"&gt; &lt;button onclick="navigateDetailImage(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/95 p-2 rounded-full shadow-md"&gt;&lt;i class="fa-solid fa-chevron-left"&gt;&lt;/i&gt;&lt;/button&gt; &lt;button onclick="navigateDetailImage(1)" class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/95 p-2 rounded-full shadow-md"&gt;&lt;i class="fa-solid fa-chevron-right"&gt;&lt;/i&gt;&lt;/button&gt; &lt;div class="absolute bottom-4 right-4 bg-black/80 text-white text-[10px] font-black px-3 py-1.5 rounded-md"&gt;${currentDetailImageIdx + 1} / 10 FOTOS</div>
</div>
<div class="grid grid-cols-5 gap-2">${thumbs}&lt;/div&gt; &lt;/div&gt; &lt;div class="flex flex-col gap-6"&gt; &lt;div&gt;&lt;h1 class="text-xl md:text-2xl font-black text-slate-800"&gt;${selectedProduct.name}</h1></div>
<div class="bg-slate-50 p-4 rounded-2xl border text-xl font-black text-indigo-600">${selectedProduct.currentPrice.toLocaleString('es-CO')} &lt;span class="text-xs font-bold text-slate-500"&gt;COP&lt;/span&gt;&lt;/div&gt; &lt;p class="text-sm text-slate-600 leading-relaxed"&gt;${selectedProduct.description}</p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${sizes} ${colors}</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 pt-2">
<button onclick="startCheckout('single')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-4 px-6 rounded-2xl text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2"><i class="fa-solid fa-paper-plane"></i> Pedir por WhatsApp</button>
<button onclick="addToCart()" class="bg-slate-900 hover:bg-indigo-600 text-white py-4 px-6 rounded-2xl text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2"><i class="fa-solid fa-bag-shopping"></i> Añadir al Carrito</button>
</div>
<div class="border-t pt-6"><h3 class="text-xs font-black text-slate-800 uppercase mb-4">Garantías de Calidad:</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${features}&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt;;
}

function changeDetailImage(idx) { currentDetailImageIdx = idx; renderProductDetailView(); }
function navigateDetailImage(dir) {
let n = currentDetailImageIdx + dir;
if(n < 0) n = 9; if(n > 9) n = 0;
currentDetailImageIdx = n;
renderProductDetailView();
}
function selectDetailSize(s) { selectedSize = s; renderProductDetailView(); }
function selectDetailColor(c) { selectedColor = c; renderProductDetailView(); }

function addToCart() {
if(!selectedSize || !selectedColor) { showNotification('Elige talla y color.', 'error'); return; }
cart.push({
cartId: Date.now(),
name: selectedProduct.name,
price: selectedProduct.currentPrice,
size: selectedSize,
color: selectedColor,
image: convertToDirectLink(selectedProduct.images[0])
});
updateCartUI();
showNotification('¡Agregado al carrito!');
}

function removeFromCart(cartId) {
cart = cart.filter(i => i.cartId !== cartId);
updateCartUI();
showNotification('Removido.', 'info');
}

function updateCartUI() {
const badge = document.getElementById('cart-badge');
const drawer = document.getElementById('cart-drawer-items');
const summary = document.getElementById('cart-drawer-summary');

badge.innerText = cart.length;
if(cart.length > 0) { badge.classList.remove('hidden'); summary.classList.remove('hidden'); }
else { badge.classList.add('hidden'); summary.classList.add('hidden'); }

if(cart.length === 0) {
drawer.innerHTML = <p class="text-center py-12 text-xs text-slate-400 font-bold"&gt;Carrito vacío.&lt;/p>;
return;
}

let html = ''; let total = 0;
cart.forEach(i => {
total += i.price;
html += &lt;div class="bg-slate-50 p-3 rounded-2xl border flex items-start gap-3 relative"&gt; &lt;img src="${i.image}" class="w-14 h-14 rounded-xl object-cover shrink-0 border bg-white">
<div class="flex-1">
<h4 class="text-xs font-bold text-slate-800 line-clamp-1">${i.name}&lt;/h4&gt; &lt;p class="text-[9px] text-slate-500 mt-0.5"&gt;Talla: ${i.size} | Color: ${i.color}&lt;/p&gt; &lt;div class="text-indigo-600 text-xs font-black mt-1"&gt;${i.price.toLocaleString('es-CO')}</div>
</div>
<button onclick="removeFromCart(${i.cartId})" class="text-slate-400 hover:text-red-500 p-1 absolute top-3 right-3"&gt;&lt;i class="fa-solid fa-trash-can"&gt;&lt;/i&gt;&lt;/button&gt; &lt;/div&gt;;
});
drawer.innerHTML = html;
document.getElementById('cart-summary-qty').innerText = cart.length;
document.getElementById('cart-summary-total').innerText = ${total.toLocaleString('es-CO')} COP`;
}

function toggleCart(open) {
document.getElementById('cart-drawer').classList.toggle('hidden', !open);
if(open) updateCartUI();
}

function startCheckout(type) {
checkoutType = type;
toggleCart(false);
toggleCheckoutModal(true);
}

function toggleCheckoutModal(open) { document.getElementById('checkout-modal').classList.toggle('hidden', !open); }
